# Full local stack: MCP server (HTTP) + Postgres job ledger + MinIO artifact store.
# The server also runs standalone (stdio) with zero infrastructure: `uvx mapsmith`.
services:
  mapsmith:
    build: .
    environment:
      MAPSMITH_TRANSPORT: http
      MAPSMITH_HOST: 0.0.0.0
      MAPSMITH_PORT: "8000"
      DATABASE_URL: postgresql://mapsmith:mapsmith@postgres:5432/mapsmith
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mapsmith
      POSTGRES_PASSWORD: mapsmith
      POSTGRES_DB: mapsmith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapsmith"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mapsmith
      MINIO_ROOT_PASSWORD: mapsmith-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
