[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mapsmith"
version = "0.2.1"
description = "Professional-grade geoprocessing for AI agents via MCP, with verifiable provenance"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "MapSmith", email = "mapsmith@proton.me" }]
keywords = ["mcp", "gis", "geoprocessing", "geospatial", "ai-agents", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: GIS",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "mcp>=1.26,<2",
  "geopandas>=1.1.2",  # security floor: CVE-2025-69662 (to_postgis)
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyogrio>=0.9",
  "pyarrow>=17",
  "duckdb>=1.4",  # security floor: CVE-2024-41672 bypassed enable_external_access
]

[project.optional-dependencies]
sedona = ["apache-sedona[db]>=1.9"]
raster = ["exactextract>=0.2", "rasterio>=1.3"]
whitebox = ["whitebox-workflows>=2.0.6,<3"]
postgres = ["psycopg[binary]>=3.2"]
test = ["pytest>=8.0", "ruff>=0.16,<0.17"]

[project.scripts]
mapsmith = "mapsmith.server:main"

[project.urls]
Homepage = "https://github.com/mapsmith-ai/MapSmith"
Repository = "https://github.com/mapsmith-ai/MapSmith"

[tool.hatch.build.targets.wheel]
packages = ["src/mapsmith"]

[tool.ruff]
# the floor is 3.10: this makes ruff refuse syntax newer than it, which
# local runs on a newer interpreter would otherwise hide until CI
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "examples",     # notebooks are pedagogy, not library code
    "benchmarks",   # research harness: follows the upstream benchmark's conventions
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
# Ship what a source build needs plus a gallery that actually runs (the
# notebooks keep their data fixture); leave out docs screenshots and repo
# plumbing. The screenshot alone was 1.2 MB of a 1.9 MB sdist, and an sdist on
# PyPI is immutable forever.
exclude = ["docs/images", "benchmarks", "deploy", ".github"]
