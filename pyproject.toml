[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mapsmith"
version = "0.2.2"
description = "Professional-grade GIS geoprocessing for AI agents via MCP, with verifiable provenance"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "MapSmith", email = "mapsmith@proton.me" }]
keywords = ["mcp", "gis", "geoprocessing", "geospatial", "ai-agents", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: GIS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  # 1.26 is the floor for resource `meta` (the MCP Apps map panel needs it);
  # 1.28.1 is the floor for three High advisories in the SDK, none of them
  # exploitable here — MapSmith uses stdio and stateless Streamable HTTP with
  # no authentication, never the websocket transport, never task handlers.
  # Raised anyway: a fresh install could resolve to 1.26 and every dependency
  # scanner would flag the package, which is a bad look for a project that
  # sells the discipline. v2 renamed FastMCP->MCPServer; migration is planned
  # with MCP Tasks.
  "mcp>=1.28.1,<2",
  "geopandas>=1.1.2",  # security floor: CVE-2025-69662 (to_postgis)
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyogrio>=0.9",
  # 21 is the floor for Parquet's geospatial logical types, which DuckDB writes:
  # measured on a file DuckDB produced, pyarrow 18 and 19 RAISE on it ("Thrift
  # LogicalType that is not recognized"), 20 opens it but reports the type as
  # `Undefined`, and 21 reports `Geometry` with its CRS. Below 21 MapSmith could
  # not read back its own run_sql output.
  "pyarrow>=21",
  # security floor: CVE-2024-41672 bypassed enable_external_access (1.4).
  # 1.5 is the floor for the `geoparquet_version` COPY option, which is how the
  # output flavour becomes OUR decision: 1.4 wrote Parquet's native geometry
  # types by default and 1.5 changed the default back to GeoParquet 1.x, so the
  # installed engine version was silently choosing our canonical format.
  # Upper bound because DuckDB 2.0 is on the autumn-2026 calendar with breaking
  # changes: without it, the first install after that release can break on its
  # own, with nothing on our side having changed.
  "duckdb>=1.5,<2",
]

[project.optional-dependencies]
sedona = ["apache-sedona[db]>=1.9"]
raster = ["exactextract>=0.2", "rasterio>=1.3"]
whitebox = ["whitebox-workflows>=2.0.6,<3"]
postgres = ["psycopg[binary]>=3.2"]
retrieval = ["model2vec>=0.9,<1"]
# jsonschema is here and not optional-with-a-skip: the manifest conformance
# test validates against the NORMATIVE schema as well as the standalone
# validator, and an importorskip would have quietly left CI checking only
# the lenient one of the two.
test = ["pytest>=8.0", "ruff>=0.16,<0.17", "jsonschema>=4.23"]

[project.scripts]
mapsmith = "mapsmith.server:main"

[project.urls]
Homepage = "https://github.com/mapsmith-ai/MapSmith"
Repository = "https://github.com/mapsmith-ai/MapSmith"

[tool.hatch.build.targets.wheel]
packages = ["src/mapsmith"]

[tool.ruff]
# the floor is 3.12: this makes ruff refuse syntax newer than it, which
# local runs on a newer interpreter would otherwise hide until CI.
# It catches syntax, never modules — a 3.13 stdlib import still reaches CI.
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "examples",     # notebooks are pedagogy, not library code
    "benchmarks",   # research harness: follows the upstream benchmark's conventions
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
# Ship what a source build needs plus a gallery that actually runs (the
# notebooks keep their data fixture); leave out docs screenshots and repo
# plumbing. The screenshot alone was 1.2 MB of a 1.9 MB sdist, and an sdist on
# PyPI is immutable forever.
exclude = ["docs/images", "benchmarks", "deploy", ".github"]
