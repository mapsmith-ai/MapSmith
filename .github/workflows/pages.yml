name: Site

# The site is a build product, not a checked-in page. Its figure and the
# manifest beside it are generated by running MapSmith on a real DEM, so the
# picture cannot drift away from what the software does without this workflow
# failing — which is the only defensible way to build a site whose argument is
# that you should not take an output on trust.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/mapsmith/**"
      - "examples/fixtures/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a run in progress finish: cancelling
# mid-deploy is how a site ends up half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
      - run: pip install -e .[raster,whitebox]
      - run: python site/build.py dist
      - name: the page must carry no unreplaced placeholder
        run: |
          python - <<'PY'
          import pathlib, sys
          pagina = pathlib.Path("dist/index.html").read_text(encoding="utf-8")
          if "{{" in pagina:
              sys.exit(f"unreplaced placeholder: {pagina[pagina.index('{{'):][:60]}")
          for atteso in ("terrain.png", "provenance", "EPSG:32610"):
              if atteso not in pagina:
                  sys.exit(f"the page lost {atteso!r} — the template and the build disagree")
          print(f"{len(pagina)} bytes, placeholders resolved")
          PY
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
