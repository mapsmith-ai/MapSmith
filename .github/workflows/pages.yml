name: Site

# The site is a build product, not a checked-in page. Its figure and the
# manifest beside it are generated by running MapSmith on a real DEM, so the
# picture cannot drift away from what the software does without this workflow
# failing — which is the only defensible way to build a site whose argument is
# that you should not take an output on trust.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/mapsmith/**"
      - "examples/fixtures/**"
      - ".github/workflows/pages.yml"
      # The page renders numbers counted from these, so a commit that changes
      # only them used to leave the live site quoting yesterday's figures with
      # nothing red anywhere: on 2026-09-01 the page said 778 test functions
      # while main had 779. The build counts `def test_` under tests/ and reads
      # the vendored Argleton run, so both belong in this filter.
      - "tests/**"
      - "docs/argleton-run.json"
  workflow_dispatch:

# Per job, not per workflow. `id-token: write` lets a job mint an OIDC token,
# and the MCP Registry grants `io.github.mapsmith-ai/*` to any token from any
# workflow of this owner. `build` installs unpinned transitive dependencies and
# runs the repository's own code, so it must not hold that permission: only
# `deploy`, which runs one SHA-pinned action and nothing of ours, does.
permissions:
  contents: read

# One deployment at a time, and let a run in progress finish: cancelling
# mid-deploy is how a site ends up half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
      - run: pip install -e .[raster,whitebox]
      - run: python site/build.py dist
      # Checked on the artefact that is about to go live, not on the builder's
      # intentions: the manifest shown on the page carried the build's
      # temporary directory in `output.path` until 2026-09-26, because only the
      # input paths were being stripped.
      - name: the published page and manifest name no build directory
        run: |
          if grep -rEn "mapsmith-site-|/tmp/|AppData" dist/index.html dist/manifest.json; then
            echo "::error::a build path reached the published page"; exit 1
          fi
      # The schema's $id promises https://mapsmith.dev/spec/manifest-v1.schema.json
      # resolves. Fetched from its source of truth at deploy time rather than
      # vendored: a copy would drift, and a drifted schema at the canonical URL
      # is worse than a 404.
      #
      # From the TAG of the draft these writers emit, not from `main`: the day
      # draft.7 lands on the spec's main, a deploy here would otherwise publish
      # an unreleased draft under the $id every record we wrote points at.
      - name: serve the manifest schema at its canonical URL
        run: |
          mkdir -p dist/spec
          spec="$(python -c 'from mapsmith.provenance import SPEC_VERSION; print(SPEC_VERSION)')"
          curl -sSf -o dist/spec/manifest-v1.schema.json \
            "https://raw.githubusercontent.com/mapsmith-ai/manifest-spec/v${spec}/schema/manifest-v1.schema.json"
          python - "$spec" <<'PY'
          import json, pathlib, sys
          schema = json.loads(pathlib.Path("dist/spec/manifest-v1.schema.json").read_text(encoding="utf-8"))
          expected = "https://mapsmith.dev/spec/manifest-v1.schema.json"
          if schema.get("$id") != expected:
              sys.exit(f"schema $id is {schema.get('$id')!r}, the site serves it at {expected!r}")
          if schema.get("x-spec-version") != sys.argv[1]:
              sys.exit(f"schema declares {schema.get('x-spec-version')!r}, the writers emit {sys.argv[1]!r}")
          print("schema ok:", schema["$id"], schema["x-spec-version"])
          PY
      - name: the page must carry no unreplaced placeholder
        run: |
          python - <<'PY'
          import pathlib, sys
          page = pathlib.Path("dist/index.html").read_text(encoding="utf-8")
          if "{{" in page:
              sys.exit(f"unreplaced placeholder: {page[page.index('{{'):][:60]}")
          for expected in ("terrain.png", "provenance", "EPSG:32610"):
              if expected not in page:
                  sys.exit(f"the page lost {expected!r} — the template and the build disagree")
          print(f"{len(page)} bytes, placeholders resolved")
          PY
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
